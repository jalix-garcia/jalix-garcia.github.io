[[pub]]
title = "Land tenure security and deforestation: Evidence from a framed field experiment in Uganda"
with = "Sarah Walker, Anne Bartlett, and Alice Calder"
venue = "Journal of Environmental Economics and Management"
citation = "131: 103137"
year = 2025
doi = "10.1016/j.jeem.2025.103137"
thumbnail = "images/pubs/2025-jeem-land-tenure.jpg"
thumbnail_alt = "Map of forest loss by county in Uganda, 2010 to 2019"
links = [
  { label = "Replication files", url = "https://doi.org/10.7910/DVN/KSCWJK" },
]
theme = "land-use-policy"
type = "article"
featured = true
summary = "In a field experiment with Ugandan forest users, insecure land tenure raised tree extraction by 23%, while the option to secure tenure through certification cut that effect in half, showing that strengthening property rights can meaningfully reduce deforestation."

[[pub]]
