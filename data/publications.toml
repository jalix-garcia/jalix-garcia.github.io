# Publications and work in progress: the single source for every list on the site.
#
# scripts/build_pages.py reads this file before each render and writes the
# publication lists used by index.qmd, publications.qmd and work-in-progress.qmd.
# Add a paper here once and it appears everywhere it should.
#
# Fields for each [[pub]]:
#   title       Title as published.
#   with        Co-authors, written as they should read after "with". Omit if sole-authored.
#   venue       Journal, book, or publisher. Shown in italics.
#   citation    Volume(issue): pages, e.g. "95(2): 417–435". Optional.
#   year        Publication year.
#   forthcoming true while the paper is accepted but not yet out.
#   doi         DOI without the https://doi.org/ prefix. The title links here.
#   url         Main link when there is no DOI (a report or working paper).
#   manuscript  Path to a PDF in files/papers/.
#   links       Extra links, each { label = "...", url = "..." } on one line.
#   theme       One of the [[theme]] ids below. Not needed for work in progress.
#   type        article | chapter | report | wip
#   status      Work in progress only, e.g. "Revise and resubmit".
#   featured    true to list the paper under "Recent publications" on the home page.
#   thumbnail   Optional image shown beside the paper under "Recent publications"
#               (images/pubs/, about 700 pixels wide). thumbnail_alt describes it.
#   summary     One or two plain-language sentences. Shown on the home page and on
#               the publications page.
#
# Each [[theme]] has an id, name, question, and a photo: image (path), image_alt
# (a description for screen readers), and image_focus (which part of the photo to
# keep when it is cropped, as a CSS position such as "center 40%").
#
# Within each theme and type, papers appear newest first; papers from the same
# year keep the order they have in this file.

