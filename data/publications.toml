with = "Roberto Toto, Katharine Sims, Bruno Coutinho, Carlos Muñoz Brenes, Ludmila Pugliese, and Alex Mendes"
venue = "Nature Communications"
citation = "16: 4715"
year = 2025
doi = "10.1038/s41467-025-59194-3"
thumbnail = "images/pubs/2025-natcomm-atlantic-forest.jpg"
thumbnail_alt = "Map of parcels supported by the Atlantic Forest Restoration Pact along Brazil's southern coast"
links = [
  { label = "Replication files", url = "https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/EZ5KCW" },
